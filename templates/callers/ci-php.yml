name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  ci:
    uses: Nibiru-ci/ci-templates/.github/workflows/ci.yml@v1
    with:
      stack: php
      lint-enforce: false
      dockerfile: ""
      fail-on: none