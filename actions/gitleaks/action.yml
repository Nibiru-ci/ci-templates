name: "Nibiru-ci / gitleaks"
description: "Detection de secrets avec la CLI Gitleaks (version epinglee, checksum verifie). Scanne les commits pousses, ou tout l'historique sur demande."

inputs:
  enforce:
    description: "Faire echouer le job si un secret est detecte (true | false)."
    required: false
    default: "true"
  scan-mode:
    description: "auto = commits du push ; full = historique complet de toutes les branches. workflow_dispatch force full."
    required: false
    default: "auto"
  config-path:
    description: "Config Gitleaks. Vide = .gitleaks.toml du projet s'il existe, sinon config par defaut Nibiru-ci."
    required: false
    default: ""
  baseline-path:
    description: "Rapport JSON Gitleaks des secrets connus a ignorer (stock existant)."
    required: false
    default: ".gitleaks-baseline.json"
  artifact-name:
    description: "Nom de l'artefact du rapport SARIF."
    required: false
    default: "gitleaks-report"

outputs:
  leaks:
    description: "Nombre de secrets detectes."
    value: ${{ steps.scan.outputs.leaks }}

runs:
  using: "composite"
  steps:
    - name: Installer Gitleaks
      id: install
      shell: bash
      env:
        GITLEAKS_VERSION: "8.30.1"
        GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      run: |
        set -euo pipefail
        if [[ "${RUNNER_OS}" != "Linux" || "${RUNNER_ARCH}" != "X64" ]]; then
          echo "::error title=gitleaks::Runner non supporte (${RUNNER_OS}/${RUNNER_ARCH}). Linux X64 requis."
          exit 1
        fi
        archive="${RUNNER_TEMP}/gitleaks.tar.gz"
        curl -sSfL --retry 3 -o "${archive}" \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -
        mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
        tar -xzf "${archive}" -C "${RUNNER_TEMP}/gitleaks-bin" gitleaks
        echo "bin=${RUNNER_TEMP}/gitleaks-bin/gitleaks" >> "${GITHUB_OUTPUT}"

    - name: Determiner la plage de commits
      id: range
      shell: bash
      env:
        INPUT_SCAN_MODE: ${{ inputs.scan-mode }}
        EVENT_NAME: ${{ github.event_name }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_AFTER: ${{ github.sha }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        zero="0000000000000000000000000000000000000000"

        if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
          echo "::error title=gitleaks::Clone superficiel detecte. actions/checkout doit utiliser fetch-depth: 0."
          exit 1
        fi

        mode="${INPUT_SCAN_MODE}"
        [[ "${EVENT_NAME}" == "workflow_dispatch" ]] && mode="full"
        case "${mode}" in auto|full) ;; *)
          echo "::error title=gitleaks::scan-mode invalide : '${mode}' (attendu : auto | full)"
          exit 1 ;;
        esac

        skip="false"
        log_opts=""
        scope=""

        branch_range() {
          local head="$1" base=""
          if git rev-parse --verify --quiet "refs/remotes/origin/${DEFAULT_BRANCH}" >/dev/null; then
            base="$(git merge-base "refs/remotes/origin/${DEFAULT_BRANCH}" "${head}" || true)"
          fi
          if [[ -n "${base}" ]]; then
            log_opts="${base}..${head}"
            scope="commits de la branche absents de ${DEFAULT_BRANCH}"
          else
            log_opts="${head}"
            scope="tous les ancetres de ${head:0:8} (aucune base commune avec ${DEFAULT_BRANCH})"
          fi
        }

        if [[ "${mode}" == "full" ]]; then
          scope="historique complet, toutes branches"
        else
          case "${EVENT_NAME}" in
            push)
              if [[ "${PUSH_AFTER}" == "${zero}" ]]; then
                skip="true"
                scope="suppression de reference, rien a scanner"
              elif [[ "${REF_TYPE}" == "branch" && "${REF_NAME}" == "${DEFAULT_BRANCH}" ]]; then
                if [[ -n "${PUSH_BEFORE}" && "${PUSH_BEFORE}" != "${zero}" ]] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
                  log_opts="${PUSH_BEFORE}..${PUSH_AFTER}"
                  scope="commits du push sur ${DEFAULT_BRANCH}"
                else
                  log_opts="${PUSH_AFTER}"
                  scope="tous les ancetres de ${PUSH_AFTER:0:8} (premier push ou force-push)"
                fi
              else
                branch_range "${PUSH_AFTER}"
              fi
              ;;
            pull_request)
              base="$(git merge-base "${PR_BASE_SHA}" "${PR_HEAD_SHA}")"
              log_opts="${base}..${PR_HEAD_SHA}"
              scope="commits de la pull request"
              ;;
            *)
              branch_range "$(git rev-parse HEAD)"
              ;;
          esac
        fi

        echo "Perimetre du scan : ${scope}"
        [[ -n "${log_opts}" ]] && echo "git log ${log_opts}"
        {
          echo "skip=${skip}"
          echo "log-opts=${log_opts}"
          echo "scope=${scope}"
        } >> "${GITHUB_OUTPUT}"

    - name: Scanner les secrets
      id: scan
      if: steps.range.outputs.skip != 'true'
      shell: bash
      env:
        INPUT_CONFIG: ${{ inputs.config-path }}
        INPUT_BASELINE: ${{ inputs.baseline-path }}
        INPUT_ENFORCE: ${{ inputs.enforce }}
        LOG_OPTS: ${{ steps.range.outputs.log-opts }}
        SCOPE: ${{ steps.range.outputs.scope }}
        DEFAULT_CONFIG: ${{ github.action_path }}/gitleaks.toml
        GITLEAKS_BIN: ${{ steps.install.outputs.bin }}
      run: |
        set -euo pipefail
        report="${RUNNER_TEMP}/gitleaks.sarif"

        if [[ -n "${INPUT_CONFIG}" ]]; then
          [[ -f "${INPUT_CONFIG}" ]] || { echo "::error title=gitleaks::config-path introuvable : ${INPUT_CONFIG}"; exit 1; }
          config="${INPUT_CONFIG}"; config_label="${INPUT_CONFIG}"
        elif [[ -f ".gitleaks.toml" ]]; then
          config=".gitleaks.toml"; config_label=".gitleaks.toml (projet)"
        else
          config="${DEFAULT_CONFIG}"; config_label="defaut Nibiru-ci"
        fi

        args=(git --no-banner --no-color --redact -c "${config}" -f sarif -r "${report}" --exit-code 99)
        baseline_label="aucune"
        if [[ -n "${INPUT_BASELINE}" && -f "${INPUT_BASELINE}" ]]; then
          args+=(--baseline-path "${INPUT_BASELINE}")
          baseline_label="${INPUT_BASELINE}"
        fi
        [[ -n "${LOG_OPTS}" ]] && args+=(--log-opts "${LOG_OPTS}")
        args+=(.)

        set +e
        "${GITLEAKS_BIN}" "${args[@]}"
        rc=$?
        set -e
        if [[ ${rc} -ne 0 && ${rc} -ne 99 ]]; then
          echo "::error title=gitleaks::Echec d'execution de Gitleaks (code ${rc})."
          exit "${rc}"
        fi

        leaks="$(jq '[.runs[]?.results[]?] | length' "${report}")"
        echo "leaks=${leaks}" >> "${GITHUB_OUTPUT}"
        echo "report=${report}" >> "${GITHUB_OUTPUT}"

        level="warning"
        [[ "${INPUT_ENFORCE}" == "true" ]] && level="error"
        jq -r --arg level "${level}" '
          def esc: gsub("%";"%25") | gsub("\r";"%0D") | gsub("\n";"%0A");
          def escp: esc | gsub(":";"%3A") | gsub(",";"%2C");
          [.runs[]?.results[]?][:50][]
          | "::\($level) file=\(.locations[0].physicalLocation.artifactLocation.uri | escp),line=\(.locations[0].physicalLocation.region.startLine),title=\("Secret : " + .ruleId | escp)::\("Commit " + (.partialFingerprints.commitSha // "?")[0:8] + " - secret a revoquer puis retirer de l historique" | esc)"
        ' "${report}"

        {
          echo "## Secrets (Gitleaks)"
          echo
          echo "| Perimetre | Config | Baseline | Resultat |"
          echo "|---|---|---|---|"
          if [[ "${leaks}" -eq 0 ]]; then status="aucun secret"; else status="**${leaks} secret(s)**"; fi
          echo "| ${SCOPE} | ${config_label} | ${baseline_label} | ${status} |"
          if [[ "${leaks}" -gt 0 ]]; then
            echo
            echo "| Regle | Fichier | Ligne | Commit | Auteur |"
            echo "|---|---|---|---|---|"
            jq -r '
              def cell: tostring | gsub("\\|";"\\|") | gsub("\n";" ");
              [.runs[]?.results[]?][:100][]
              | "| \(.ruleId | cell) | `\(.locations[0].physicalLocation.artifactLocation.uri | cell)` | \(.locations[0].physicalLocation.region.startLine) | `\((.partialFingerprints.commitSha // "?")[0:8])` | \(.partialFingerprints.author // "?" | cell) |"
            ' "${report}"
            echo
            echo "Un secret pousse est compromis : **revoquer et remplacer d'abord**, nettoyer l'historique ensuite. Faux positif : ajouter son empreinte dans \`.gitleaksignore\`."
          fi
        } >> "${GITHUB_STEP_SUMMARY}"

    - name: Publier le rapport
      if: always() && steps.scan.outputs.report != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.scan.outputs.report }}
        retention-days: 30
        if-no-files-found: ignore

    - name: Appliquer la politique
      if: steps.range.outputs.skip != 'true'
      shell: bash
      env:
        INPUT_ENFORCE: ${{ inputs.enforce }}
        LEAKS: ${{ steps.scan.outputs.leaks }}
      run: |
        set -euo pipefail
        if [[ "${LEAKS:-0}" -gt 0 ]]; then
          if [[ "${INPUT_ENFORCE}" == "true" ]]; then
            echo "::error title=gitleaks::${LEAKS} secret(s) detecte(s). Voir le resume du job."
            exit 1
          fi
          echo "::warning title=gitleaks::${LEAKS} secret(s) detecte(s) (mode rapport, non bloquant)."
        fi
